<text x="889.5" y="170" fill="#e3bd1f" font-size="11.5">upper row</text>
<text x="889.5" y="220" fill="#f08a8a" font-size="11.5">power,</text>
<text x="889.5" y="234" fill="#f08a8a" font-size="11.5">lower row</text>
<text x="836" y="258" text-anchor="middle" fill="#7fd8a0" font-size="11.5">moulded 1 is this one</text>
<text x="725.5" y="290" fill="#9fb0c4" font-size="11.5">The lower row of a right-angle header is</text>
<text x="725.5" y="306" fill="#9fb0c4" font-size="11.5">the one nearest the PCB — so on the board</text>
<text x="725.5" y="322" fill="#9fb0c4" font-size="11.5">the power pads sit inside the connector</text>
<text x="725.5" y="338" fill="#9fb0c4" font-size="11.5">body at the edge, and the CAN pads sit</text>
<text x="725.5" y="354" fill="#9fb0c4" font-size="11.5">one row further in.</text>
<text x="725.5" y="370" fill="#9fb0c4" font-size="11.5"></text>
<text x="725.5" y="386" fill="#9fb0c4" font-size="11.5">J1 and J2 are wired in parallel on the</text>
<text x="725.5" y="402" fill="#9fb0c4" font-size="11.5">same four nets (plan 3.4) — either one</text>
<text x="725.5" y="418" fill="#9fb0c4" font-size="11.5">will do.</text>
<text x="725.5" y="434" fill="#9fb0c4" font-size="11.5"></text>
<text x="725.5" y="450" fill="#f0b45a" font-size="11.5">Ring circuit 1 out to +5V on the board</text>
<text x="725.5" y="466" fill="#f0b45a" font-size="11.5">before the first power-up.</text>
