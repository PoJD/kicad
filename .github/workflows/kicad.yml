name: kicad

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  erc-drc:
    name: ERC and DRC
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      # The image defaults to the unprivileged "kicad" user, but the runner
      # creates /__w and its file-command files as root. Without this the job
      # dies in "Post Run actions/checkout" with EACCES on _runner_file_commands.
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: kicad-cli version
        run: kicad-cli version

      # Skeleton: while the repo holds no schematic this passes doing nothing.
      # As soon as the first .kicad_sch lands, it starts checking on its own.
      - name: ERC on every schematic
        run: |
          shopt -s globstar nullglob
          found=0
          for sch in **/*.kicad_sch; do
            found=1
            echo "--- ERC $sch"
            kicad-cli sch erc --exit-code-violations "$sch"
          done
          [ "$found" = 1 ] || echo "no schematic in the repo, skipping"

      - name: DRC on every board
        run: |
          shopt -s globstar nullglob
          found=0
          for pcb in **/*.kicad_pcb; do
            found=1
            echo "--- DRC $pcb"
            kicad-cli pcb drc --exit-code-violations "$pcb"
          done
          [ "$found" = 1 ] || echo "no board in the repo, skipping"

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .kicad_prl is local state, not design. Once it is committed it
      # pollutes every diff.
      - name: no .kicad_prl in the repo
        run: |
          if find . -name '*.kicad_prl' -not -path './.git/*' | grep -q .; then
            echo "ERROR: .kicad_prl belongs in .gitignore"
            find . -name '*.kicad_prl' -not -path './.git/*'
            exit 1
          fi
          echo "ok"
