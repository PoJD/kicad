name: kicad

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  erc-drc:
    name: ERC and DRC
    runs-on: ubuntu-latest
    container:
      # Must match the KiCad the design files were written by — KiCad cannot
      # open a file from a newer major version, so a mismatch here fails the
      # job on the very first ERC.
      image: kicad/kicad:10.0
      # The image defaults to the unprivileged "kicad" user, but the runner
      # creates /__w and its file-command files as root. Without this the job
      # dies in "Post Run actions/checkout" with EACCES on _runner_file_commands.
      options: --user root

    # ...but running as root also moves HOME to /root, where KiCad finds no
    # symbol or footprint library table. It then reports every symbol on the
    # sheet as lib_symbol_issues / footprint_link_issues - 64 warnings here -
    # and --exit-code-violations turns those into a failed job. Point HOME at
    # the image's own KiCad user so the standard libraries resolve.
    env:
      HOME: /home/kicad

    steps:
      - uses: actions/checkout@v4

      - name: kicad-cli version
        run: kicad-cli version

      # These two steps are plain POSIX shell on purpose. They used to open
      # with "shopt -s globstar nullglob", which only exists in bash, and they
      # failed on every run - including runs where the repo held no schematic
      # at all, which is what gave the game away. Nothing here needs bash:
      # `find` walks the tree and a `while read` loop consumes it.
      #
      # Every file is checked before the step gives up, rather than stopping
      # at the first bad one, so a red run tells you everything that is wrong
      # in one go.
      #
      # Finding nothing is an error, not a note. These steps used to say
      # "skipping" and pass on an empty list, which is the old globstar bug
      # wearing the opposite mask: back then a broken loop failed loudly, and
      # that is what gave it away. A repository that will never again be
      # without design files has no business going green without opening one.
      - name: ERC on every schematic
        run: |
          find . -path ./.git -prune -o -name '*.kicad_sch' -print | sort > /tmp/sch.list
          status=0
          count=0
          while IFS= read -r sch; do
            count=$((count + 1))
            echo "--- ERC $sch"
            kicad-cli sch erc --exit-code-violations "$sch" || status=1
          done < /tmp/sch.list
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no .kicad_sch found - this step would have passed without checking anything"
            exit 1
          fi
          echo "$count schematic(s) checked"
          exit $status

      - name: DRC on every board
        run: |
          find . -path ./.git -prune -o -name '*.kicad_pcb' -print | sort > /tmp/pcb.list
          status=0
          count=0
          while IFS= read -r pcb; do
            count=$((count + 1))
            echo "--- DRC $pcb"
            kicad-cli pcb drc --exit-code-violations "$pcb" || status=1
          done < /tmp/pcb.list
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no .kicad_pcb found - this step would have passed without checking anything"
            exit 1
          fi
          echo "$count board(s) checked"
          exit $status

      # ERC and DRC prove the files are well formed. They do not prove the
      # design is the intended one: swapping the labels on U1 pins 23 and 24 -
      # CANTX and CANRX crossed at the MCU, a board that would never transmit -
      # passes ERC with zero violations, because both are bidirectional pins.
      # A decoupling capacitor 40 mm from its pin passes DRC for the same kind
      # of reason. These two compare the design against the tables in
      # canfuel/docs/implementation-plan.md instead.
      #
      # Both are canfuel-specific by design. A second board would want its own
      # pair rather than a generalisation of these.
      - name: Netlist and placement match the plan
        run: |
          python3 tools/check-netlist.py
          python3 tools/check-placement.py

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .kicad_prl is local state, not design. Once it is committed it
      # pollutes every diff.
      - name: no .kicad_prl in the repo
        run: |
          if find . -name '*.kicad_prl' -not -path './.git/*' | grep -q .; then
            echo "ERROR: .kicad_prl belongs in .gitignore"
            find . -name '*.kicad_prl' -not -path './.git/*'
            exit 1
          fi
          echo "ok"
